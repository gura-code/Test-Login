<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piattaforma Privata</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }
        .card {
            background: white;
            max-width: 450px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        button {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        button:hover { background-color: #357ae8; }
        #logoutBtn { background-color: #db4437; margin-top: 20px; }
        #logoutBtn:hover { background-color: #c23321; }
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Piattaforma Privata</h2>
        <p id="status">Caricamento in corso...</p>
        
        <!-- Sezione Login (Se non sei loggato) -->
        <div id="login-section" style="display: none;">
            <p>Accedi con il tuo account Google per entrare nella community.</p>
            <button id="googleLoginBtn">Accedi con Google</button>
        </div>
        
        <!-- Sezione Piattaforma / Dashboard (Se SEI loggato) -->
        <div id="user-section" style="display: none;">
            <img id="userPhoto" class="user-avatar" src="" alt="Foto profilo" style="display:none;">
            <h3>Benvenuto, <span id="userName"></span>!</h3>
            <p id="userEmail" style="color: #666; font-size: 14px;"></p>
            
            <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">
            
            <h4>La tua bacheca personale</h4>
            <p style="font-size: 14px; text-align: left;">Scrivi qualcosa per testare il salvataggio dei dati:</p>
            <textarea id="userStatusInput" rows="3" placeholder="Come stai oggi? A cosa stai lavorando?"></textarea>
            <button id="saveDataBtn" style="background-color: #0F9D58; margin-top: 10px;">Salva sul database</button>
            <p id="saveMessage" style="font-size: 13px; color: green; margin-top: 5px; font-weight: bold;"></p>

            <button id="logoutBtn">Esci (Logout)</button>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAmFS014XYQ8b3pJ5iz2g5m8kwiqgizuBY",
          authDomain: "test-login-5d045.firebaseapp.com",
          projectId: "test-login-5d045",
          storageBucket: "test-login-5d045.firebasestorage.app",
          messagingSenderId: "405305919800",
          appId: "1:405305919800:web:dc110785fd431b066459cd"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            const provider = new GoogleAuthProvider();

            // Gestisce il ritorno dal redirect di Google
            getRedirectResult(auth).catch((error) => {
                console.error("Errore redirect:", error);
            });

            // Controlla se l'utente è loggato o meno
            onAuthStateChanged(auth, async (user) => {
                document.getElementById("status").style.display = "none";
                if (user) {
                    // Utente loggato: mostra la dashboard
                    document.getElementById("login-section").style.display = "none";
                    document.getElementById("user-section").style.display = "block";
                    
                    document.getElementById("userName").innerText = user.displayName || "Utente";
                    document.getElementById("userEmail").innerText = user.email;
                    
                    if (user.photoURL) {
                        const photo = document.getElementById("userPhoto");
                        photo.src = user.photoURL;
                        photo.style.display = "inline-block";
                    }

                    // Prova a caricare eventuali dati salvati in precedenza
                    try {
                        const docRef = doc(db, "users", user.uid);
                        const docSnap = await getDoc(docRef);
                        if (docSnap.exists()) {
                            document.getElementById("userStatusInput").value = docSnap.data().statusText || "";
                        }
                    } catch (e) {
                        console.log("Dati non ancora presenti sul database.");
                    }

                } else {
                    // Utente non loggato: mostra il pulsante di accesso
                    document.getElementById("login-section").style.display = "block";
                    document.getElementById("user-section").style.display = "none";
                }
            });

            // Azione tasto Login
            document.getElementById("googleLoginBtn").addEventListener("click", () => {
                signInWithRedirect(auth, provider);
            });

            // Azione tasto Salva Dati
            document.getElementById("saveDataBtn").addEventListener("click", async () => {
                const user = auth.currentUser;
                const text = document.getElementById("userStatusInput").value;
                if (user) {
                    try {
                        await setDoc(doc(db, "users", user.uid), {
                            name: user.displayName,
                            email: user.email,
                            statusText: text,
                            updatedAt: new Date().toISOString()
                        });
                        document.getElementById("saveMessage সিনেমা").innerText = "Dati salvati con successo!";
                        document.getElementById("saveMessage").innerText = "Dati salvati con successo sul database!";
                        setTimeout(() => { document.getElementById("saveMessage").innerText = ""; }, 3000);
                    } catch (error) {
                        console.error("Errore salvataggio:", error);
                        alert("Errore nel salvataggio. Assicurati di aver attivato Firestore nella console di Firebase.");
                    }
                }
            });

            // Azione tasto Logout
            document.getElementById("logoutBtn").addEventListener("click", () => {
                signOut(auth).then(() => {
                    window.location.reload();
                }).catch((error) => {
                    console.error("Errore logout:", error);
                });
            });

        } catch (error) {
            document.getElementById("status").innerText = "Errore di configurazione.";
            console.error("Errore:", error);
        }
    </script>

</body>
</html>
