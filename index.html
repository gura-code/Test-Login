<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piattaforma Privata - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 400px;
        }
        button {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #357ae8;
        }
        #logoutBtn {
            background-color: #db4437;
        }
        #logoutBtn:hover {
            background-color: #c23321;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Piattaforma Privata</h2>
        <p id="status">Caricamento in corso...</p>
        
        <!-- Sezione visibile quando NON sei loggato -->
        <div id="login-section" style="display: none;">
            <p>Accedi con il tuo account Google per entrare:</p>
            <button id="googleLoginBtn">Accedi con Google</button>
        </div>
        
        <!-- Sezione visibile quando SEI loggato -->
        <div id="user-section" style="display: none;">
            <p>Benvenuto, <span id="userName"></span>!</p>
            <button id="logoutBtn">Esci</button>
        </div>
    </div>

    <!-- Script JavaScript per Firebase e Autenticazione Google -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAmFS014XYQ8b3pJ5iz2g5m8kwiqgizuBY",
          authDomain: "test-login-5d045.firebaseapp.com",
          projectId: "test-login-5d045",
          storageBucket: "test-login-5d045.firebasestorage.app",
          messagingSenderId: "405305919800",
          appId: "1:405305919800:web:dc110785fd431b066459cd"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const provider = new GoogleAuthProvider();

            // Gestisce il ritorno dal login con Google
            getRedirectResult(auth)
                .catch((error) => {
                    console.error("Errore durante il redirect:", error);
                    alert("Errore di login: " + error.message);
                });

            // Ascolta i cambiamenti di stato dell'utente
            onAuthStateChanged(auth, (user) => {
                document.getElementById("status").style.display = "none";
                if (user) {
                    document.getElementById("login-section").style.display = "none";
                    document.getElementById("user-section").style.display = "block";
                    document.getElementById("userName").innerText = user.displayName || user.email;
                } else {
                    document.getElementById("login-section").style.display = "block";
                    document.getElementById("user-section").style.display = "none";
                }
            });

            // Avvia il login reindirizzando la pagina (ottimo per mobile)
            document.getElementById("googleLoginBtn").addEventListener("click", () => {
                signInWithRedirect(auth, provider);
            });

            // Gestione Logout
            document.getElementById("logoutBtn").addEventListener("click", () => {
                signOut(auth).catch((error) => {
                    console.error("Errore durante il logout:", error);
                });
            });

        } catch (error) {
            document.getElementById("status").innerText = "Errore di configurazione Firebase.";
            console.error("Errore:", error);
        }
    </script>

</body>
</html>
