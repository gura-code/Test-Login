<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quartier Generale & Giornale Personale</title>
    <!-- Google Fonts & Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmFS014XYQ8b3pJ5iz2g5m8kwiqgizuBY",
            authDomain: "test-login-5d045.firebaseapp.com",
            projectId: "test-login-5d045",
            storageBucket: "test-login-5d045.firebasestorage.app",
            messagingSenderId: "405305919800",
            appId: "1:405305919800:web:dc110785fd431b066459cd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.appAuth = auth;
        window.appDb = db;
        window.googleProvider = provider;
        window.signInWithPopup = signInWithPopup;
        window.signOut = signOut;
        window.signInWithRedirect = window.signInWithRedirect;
        window.onAuthStateChanged = onAuthStateChanged;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
    </script>
    <style>
        :root {
            --bg-color: #fdfdfd;
            --text-color: #222222;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --accent-color: #333333;
            --hover-color: #555555;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --accent-color: #e0e0e0;
            --hover-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav button {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.95rem;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        nav button.active, nav button:hover {
            background: var(--border-color);
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 0.95rem;
        }

        button.btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        button.btn:hover {
            opacity: 0.85;
        }

        .news-item {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .news-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .news-meta {
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 5px;
        }

        .news-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .news-summary {
            font-size: 0.95rem;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .news-link {
            font-size: 0.85rem;
            color: var(--text-color);
            text-decoration: underline;
        }

        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            text-align: center;
        }

        .audio-player-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Schermata Login -->
    <div id="login-screen">
        <div class="card" style="max-width: 400px; width: 100%;">
            <h2>Quartier Generale</h2>
            <p style="margin-bottom: 20px; font-size: 0.9rem; color: #666;">Accedi con il tuo account Google per entrare nello spazio privato.</p>
            <button class="btn" id="login-btn" style="width: 100%;">Accedi con Google</button>
        </div>
    </div>

    <!-- Applicazione Principale -->
    <div id="app-screen" style="display: none;">
        <header>
            <div class="logo" id="app-title">Il Mio Spazio</div>
            <nav>
                <button onclick="switchPage('news')" id="nav-news" class="active">Giornale</button>
                <button onclick="switchPage('profile')" id="nav-profile">Profilo</button>
                <button onclick="switchPage('routine')" id="nav-routine">Studio</button>
                <button onclick="switchPage('calendar')" id="nav-calendar">Calendario</button>
            </nav>
            <button class="btn" onclick="logout()" style="padding: 5px 10px; font-size: 0.8rem;">Esci</button>
        </header>

        <main>
            <!-- PAGINA 1: GIORNALE & NOTIZIE (Stile TG1 / Rai / Fonti esterne) -->
            <div id="page-news" class="page active">
                <div class="card">
                    <h2>Aggiungi Notizia o Articolo dalla Rete</h2>
                    <input type="text" id="news-title-input" placeholder="Titolo della notizia...">
                    <textarea id="news-summary-input" placeholder="Breve sintesi o appunti personali..." rows="3"></textarea>
                    <input type="text" id="news-url-input" placeholder="Link alla fonte originale (es. ansa.it, rainews.it)...">
                    <button class="btn" onclick="addNewsItem()">Salva Notizia</button>
                </div>

                <div class="card">
                    <h2>Il Tuo Giornale Personale</h2>
                    <div id="news-feed">
                        <!-- Le notizie caricate appariranno qui -->
                    </div>
                </div>
            </div>

            <!-- PAGINA 2: PROFILO -->
            <div id="page-profile" class="page">
                <div class="card">
                    <h2>Personalizza Profilo</h2>
                    <label style="font-size: 0.85rem;">Nome / Testata:</label>
                    <input type="text" id="profile-name" placeholder="Il tuo nome">
                    <label style="font-size: 0.85rem;">Link Immagine Profilo (URL):</label>
                    <input type="text" id="profile-avatar" placeholder="https://...">
                    <label style="font-size: 0.85rem;">Tema Grafico:</label>
                    <select id="profile-theme" onchange="changeTheme()">
                        <option value="light">Chiaro (Minimale)</option>
                        <option value="dark">Scuro</option>
                    </select>
                    <button class="btn" onclick="saveProfile()" style="margin-top: 10px;">Salva Modifiche</button>
                </div>
            </div>

            <!-- PAGINA 3: STUDIO & ROUTINE -->
            <div id="page-routine" class="page">
                <div class="card">
                    <h2>Timer Studio (Pomodoro)</h2>
                    <div style="font-size: 2.5rem; font-weight: 700; text-align: center; margin: 15px 0;" id="timer-display">25:00</div>
                    <div style="display: flex; gap: 10px; justify-content: center;">
                        <button class="btn" onclick="startTimer()">Avvia</button>
                        <button class="btn" onclick="pauseTimer()" style="background: #777;">Pausa</button>
                        <button class="btn" onclick="resetTimer()" style="background: #555;">Reset</button>
                    </div>
                </div>
                <div class="card">
                    <h2>Blocco Note Rapido</h2>
                    <textarea id="quick-notes" placeholder="Scrivi qui i tuoi pensieri o le cose da fare..." rows="5" oninput="autoSaveNotes()"></textarea>
                </div>
            </div>

            <!-- PAGINA 4: CALENDARIO -->
            <div id="page-calendar" class="page">
                <div class="card">
                    <h2>Scadenze & Promemoria</h2>
                    <input type="date" id="cal-date">
                    <input type="text" id="cal-text" placeholder="Descrizione impegno...">
                    <button class="btn" onclick="addCalendarEvent()">Aggiungi Promemoria</button>
                </div>
                <div class="card">
                    <h2>Agenda</h2>
                    <div id="calendar-list"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Gestione Navigazione Pagine
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.getElementById('nav-' + pageId).classList.add('active');
        }

        // Auth & Firebase logic
        window.addEventListener('DOMContentLoaded', () => {
            window.onAuthStateChanged(window.appAuth, (user) => {
                if (user) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'block';
                    loadUserData(user.uid);
                    loadNews(user.uid);
                    loadNotes(user.uid);
                } else {
                    document.getElementById('login-screen').style.display = 'flex';
                    document.getElementById('app-screen').style.display = 'none';
                }
            });

            document.getElementById('login-btn').addEventListener('click', () => {
                window.signInWithPopup(window.appAuth, window.googleProvider).catch((error) => {
                    console.error("Errore login:", error);
                });
            });
        });

        function logout() {
            window.signOut(window.appAuth);
        }

        // Funzione Lettore Vocale (Text-to-Speech)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Ferma eventuali letture precedenti
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'it-IT';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Il tuo browser non supporta la sintesi vocale.");
            }
        }

        // Gestione Notizie & Giornale
        async function addNewsItem() {
            const user = window.appAuth.currentUser;
            if (!user) return;

            const title = document.getElementById('news-title-input').value;
            const summary = document.getElementById('news-summary-input').value;
            const url = document.getElementById('news-url-input').value;

            if (!title) return alert("Inserisci almeno un titolo.");

            try {
                await window.addDoc(window.collection(window.appDb, `users/${user.uid}/news`), {
                    title,
                    summary,
                    url,
                    date: new Date().toLocaleDateString()
                });
                document.getElementById('news-title-input').value = '';
                document.getElementById('news-summary-input').value = '';
                document.getElementById('news-url-input').value = '';
                loadNews(user.uid);
            } catch (e) {
                console.error("Errore salvataggio notizia:", e);
            }
        }

        async function loadNews(uid) {
            const feed = document.getElementById('news-feed');
            feed.innerHTML = 'Caricamento...';
            try {
                const querySnapshot = await window.getDocs(window.collection(window.appDb, `users/${uid}/news`));
                feed.innerHTML = '';
                if (querySnapshot.empty) {
                    feed.innerHTML = '<p style="font-size:0.9rem; color:#777;">Nessuna notizia salvata. Incollane una qui sopra!</p>';
                    return;
                }
                querySnapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const div = document.createElement('div');
                    div.className = 'news-item';
                    div.innerHTML = `
                        <div class="news-meta">${item.date}</div>
                        <div class="news-title">${item.title}</div>
                        <div class="news-summary">${item.summary || ''}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                            ${item.url ? `<a href="${item.url}" target="_blank" class="news-link">Leggi alla fonte originale</a>` : '<span></span>'}
                            <button class="btn" style="padding:4px 10px; font-size:0.75rem;" onclick="speakText('${encodeURIComponent(item.title + '. ' + (item.summary || ''))}')">Ascolta</button>
                        </div>
                    `;
                    feed.appendChild(div);
                });
            } catch (e) {
                console.error("Errore caricamento notizie:", e);
            }
        }

        // Sovrascriviamo speakText per decodificare il testo passato via onclick
        window.speakText = function(encodedText) {
            const text = decodeURIComponent(encodedText);
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'it-IT';
                window.speechSynthesis.speak(utterance);
            }
        }

        // Timer Studio
        let timerInterval;
        let timeLeft = 25 * 60;
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer-display').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    alert("Tempo scaduto! Fai una pausa.");
                }
            }, 1000);
        }
        function pauseTimer() { clearInterval(timerInterval); }
        function resetTimer() { clearInterval(timerInterval); timeLeft = 25 * 60; updateTimerDisplay(); }

        // Blocco Note con salvataggio automatico locale
        function autoSaveNotes() {
            const text = document.getElementById('quick-notes').value;
            localStorage.setItem('quick_notes', text);
        }
        function loadNotes(uid) {
            const saved = localStorage.getItem('quick_notes');
            if (saved) document.getElementById('quick-notes').value = saved;
        }

        // Profilo & Tema
        function changeTheme() {
            const theme = document.getElementById('profile-theme').value;
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
            localStorage.setItem('theme', theme);
        }

        async function saveProfile() {
            const user = window.appAuth.currentUser;
            if (!user) return;
            const name = document.getElementById('profile-name').value;
            const avatar = document.getElementById('profile-avatar').value;
            try {
                await window.setDoc(window.doc(window.appDb, `users/${user.uid}/profile/data`), { name, avatar }, { merge: true });
                if(name) document.getElementById('app-title').textContent = name;
                alert("Profilo salvato!");
            } catch(e) { console.error(e); }
        }

        async function loadUserData(uid) {
            try {
                const docSnap = await window.getDoc(window.doc(window.appDb, `users/${uid}/profile/data`));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if(data.name) {
                        document.getElementById('profile-name').value = data.name;
                        document.getElementById('app-title').textContent = data.name;
                    }
                    if(data.avatar) document.getElementById('profile-avatar').value = data.avatar;
                }
            } catch(e) { console.error(e); }
        }

        // Calendario Promemoria
        async function addCalendarEvent() {
            const user = window.appAuth.currentUser;
            if(!user) return;
            const date = document.getElementById('cal-date').value;
            const text = document.getElementById('cal-text').value;
            if(!date || !text) return alert("Inserisci data e descrizione.");
            try {
                await window.addDoc(window.collection(window.appDb, `users/${user.uid}/calendar`), { date, text });
                document.getElementById('cal-date').value = '';
                document.getElementById('cal-text').value = '';
                loadCalendar(user.uid);
            } catch(e) { console.error(e); }
        }

        async function loadCalendar(uid) {
            const list = document.getElementById('calendar-list');
            try {
                const snap = await window.getDocs(window.collection(window.appDb, `users/${uid}/calendar`));
                list.innerHTML = '';
                snap.forEach(d => {
                    const item = d.data();
                    const div = document.createElement('div');
                    div.style.cssText = "padding:8px 0; border-bottom:1px solid var(--border-color); font-size:0.9rem;";
                    div.innerHTML = `<strong>${item.date}</strong>: ${item.text}`;
                    list.appendChild(div);
                });
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
