<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniSocial</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #262626;
            margin: 0;
            padding-bottom: 50px;
        }
        header {
            background: white;
            border-bottom: 1px solid #dbdbdb;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h1 { font-size: 20px; margin: 0; font-weight: bold; color: #db4437; cursor: pointer; }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .card {
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        button {
            background-color: #0095f6;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background-color: #1877f2; }
        .danger-btn { background-color: #ed4956; }
        .danger-btn:hover { background-color: #c93b45; }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
            margin-bottom: 10px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .post-header img { width: 35px; height: 35px; }
        .post-author { font-weight: bold; font-size: 14px; }
        .post-date { font-size: 11px; color: #8e8e8e; }
        .post-content { font-size: 15px; line-height: 1.4; margin-bottom: 15px; word-break: break-word; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-links a { text-decoration: none; color: #262626; font-weight: bold; font-size: 14px; cursor: pointer; }
        .profile-banner {
            text-align: center;
            padding: 20px;
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .profile-banner img { width: 80px; height: 80px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header id="mainHeader" style="display:none;">
        <h1 onclick="showHome()">MiniSocial</h1>
        <div class="nav-links">
            <a onclick="showHome()">Home</a>
            <a onclick="showMyProfile()">Il mio Profilo</a>
            <a onclick="logout()" style="color: #ed4956;">Esci</a>
        </div>
    </header>

    <div class="container">
        <!-- Schermata Login -->
        <div id="login-section" class="card" style="text-align: center; display: none; margin-top: 50px;">
            <h2>Benvenuto su MiniSocial</h2>
            <p style="color: #8e8e8e; margin-bottom: 20px;">Accedi con Google per condividere post e vedere quelli degli altri.</p>
            <button id="googleLoginBtn" style="width: 100%;">Accedi con Google</button>
        </div>

        <!-- Vista Feed Home -->
        <div id="home-view" style="display: none;">
            <!-- Crea Post -->
            <div class="card">
                <h3>Cosa c'è di nuovo?</h3>
                <textarea id="postInput" rows="3" placeholder="Condividi un pensiero con la community..."></textarea>
                <div style="text-align: right;">
                    <button id="publishBtn">Pubblica</button>
                </div>
            </div>
            <!-- Lista Post -->
            <div id="feedContainer"></div>
        </div>

        <!-- Vista Profilo Utente -->
        <div id="profile-view" style="display: none;">
            <div id="profileBanner" class="profile-banner"></div>
            <h3 style="margin-bottom: 15px;">Post pubblicati:</h3>
            <div id="profileFeedContainer"></div>
        </div>
    </div>

    <!-- Script Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAmFS014XYQ8b3pJ5iz2g5m8kwiqgizuBY",
          authDomain: "test-login-5d045.firebaseapp.com",
          projectId: "test-login-5d045",
          storageBucket: "test-login-5d045.firebasestorage.app",
          messagingSenderId: "405305919800",
          appId: "1:405305919800:web:dc110785fd431b066459cd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // Gestione Auth State
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("mainHeader").style.display = "flex";
                showHome();
            } else {
                document.getElementById("login-section").style.display = "block";
                document.getElementById("mainHeader").style.display = "none";
                document.getElementById("home-view").style.display = "none";
                document.getElementById("profile-view").style.display = "none";
            }
        });

        // Pulsante Login
        document.getElementById("googleLoginBtn").addEventListener("click", () => {
            signInWithPopup(auth, provider).catch(e => alert("Errore login: " + e.message));
        });

        // Funzione Logout globale
        window.logout = () => {
            signOut(auth).then(() => window.location.reload());
        };

        // Navigazione: Mostra Home
        window.showHome = async () => {
            document.getElementById("home-view").style.display = "block";
            document.getElementById("profile-view").style.display = "none";
            await loadFeed("feedContainer");
        };

        // Navigazione: Mostra Profilo Personale
        window.showMyProfile = () => {
            if (currentUser) {
                window.showUserProfile(currentUser.uid, currentUser.displayName, currentUser.email, currentUser.photoURL);
            }
        };

        // Mostra Profilo di un utente specifico
        window.showUserProfile = async (uid, name, email, photoURL) => {
            document.getElementById("home-view").style.display = "none";
            document.getElementById("profile-view").style.display = "block";

            const banner = document.getElementById("profileBanner");
            banner.innerHTML = `
                <img src="${photoURL || 'https://via.placeholder.com/80'}" class="user-avatar" style="width:80px;height:80px;">
                <h2>${name || 'Utente'}</h2>
                <p style="color: #8e8e8e; font-size: 14px; margin: 0;">${email || ''}</p>
            `;

            await loadUserPosts(uid, "profileFeedContainer");
        };

        // Pubblica Post
        document.getElementById("publishBtn").addEventListener("click", async () => {
            const text = document.getElementById("postInput").value.trim();
            if (!text) return alert("Scrivi qualcosa prima di pubblicare!");

            try {
                await addDoc(collection(db, "posts"), {
                    uid: currentUser.uid,
                    name: currentUser.displayName || "Utente",
                    email: currentUser.email,
                    photoURL: currentUser.photoURL || "",
                    text: text,
                    createdAt: serverTimestamp()
                });
                document.getElementById("postInput").value = "";
                await loadFeed("feedContainer");
            } catch (e) {
                console.error("Errore pubblicazione:", e);
                alert("Errore durante la pubblicazione.");
            }
        });

        // Carica Feed Generale
        async function loadFeed(containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = "<p style='text-align:center; color:#8e8e8e;'>Caricamento post...</p>";

            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                container.innerHTML = "";
                if (querySnapshot.empty) {
                    container.innerHTML = "<p style='text-align:center; color:#8e8e8e;'>Nessun post trovato. Sii il primo a scrivere qualcosa!</p>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    const postId = docSnap.id;
                    container.appendChild(createPostCard(post, postId));
                });
            } catch (e) {
                console.error("Errore caricamento feed:", e);
                container.innerHTML = "<p style='text-align:center; color:red;'>Errore nel caricamento dei post.</p>";
            }
        }

        // Carica Post di un singolo utente
        async function loadUserPosts(uid, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = "<p style='text-align:center; color:#8e8e8e;'>Caricamento post...</p>";

            try {
                const q = query(collection(db, "posts"), where("uid", "==", uid));
                const querySnapshot = await getDocs(q);
                
                container.innerHTML = "";
                if (querySnapshot.empty) {
                    container.innerHTML = "<p style='text-align:center; color:#8e8e8e;'>Questo utente non ha ancora pubblicato nulla.</p>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    const postId = docSnap.id;
                    container.appendChild(createPostCard(post, postId));
                });
            } catch (e) {
                console.error("Errore caricamento profilo:", e);
                container.innerHTML = "<p style='text-align:center; color:red;'>Errore nel caricamento.</p>";
            }
        }

        // Crea l'elemento HTML di un post
        function createPostCard(post, postId) {
            const card = document.createElement("div");
            card.className = "card";

            const dateStr = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleString() : "Data recente";
            const avatar = post.photoURL || "https://via.placeholder.com/40";

            let deleteBtnHtml = "";
            if (currentUser && post.uid === currentUser.uid) {
                deleteBtnHtml = `<button onclick="deletePost('${postId}')" class="danger-btn" style="padding: 4px 8px; font-size: 11px; float: right;">Elimina</button>`;
            }

            card.innerHTML = `
                <div class="post-header" onclick="showUserProfile('${post.uid}', '${post.name}', '${post.email}', '${post.photoURL}')">
                    <img src="${avatar}" class="user-avatar" alt="Avatar">
                    <div>
                        <div class="post-author">${post.name}</div>
                        <div class="post-date">${dateStr}</div>
                    </div>
                </div>
                <div class="post-content">${escapeHtml(post.text)}</div>
                ${deleteBtnHtml}
            `;
            return card;
        }

        // Elimina post
        window.deletePost = async (postId) => {
            if (confirm("Vuoi davvero eliminare questo post?")) {
                try {
                    await deleteDoc(doc(db, "posts", postId));
                    showHome();
                } catch (e) {
                    alert("Errore durante l'eliminazione.");
                }
            }
        };

        // Sicurezza di base per evitare injection nel testo
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            .replace(/[&<>"']/g, m => map[m]);
            return text;
        }
    </script>

</body>
</html>
